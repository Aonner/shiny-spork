<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mittens' Grand Adventure</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(to bottom, #87CEEB 0%, #E0F6FF 100%);
            font-family: 'Arial', sans-serif;
        }

        #gameContainer {
            text-align: center;
            position: relative;
        }

        #canvasWrapper {
            position: relative;
            display: inline-block;
        }

        canvas {
            border: 4px solid #333;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            background: linear-gradient(to bottom, #87CEEB 0%, #E0F6FF 70%, #90EE90 70%, #90EE90 100%);
            display: block;
        }

        #scoreDisplay {
            position: absolute;
            top: 15px;
            left: 15px;
            color: #333;
            font-weight: bold;
            text-align: left;
            font-size: 20px;
            text-shadow: 2px 2px 4px rgba(255, 255, 255, 0.8);
        }

        #currentScore {
            margin-bottom: 5px;
        }

        #topScore {
            font-size: 18px;
            color: #666;
        }

        #livesDisplay {
            margin-top: 10px;
            display: flex;
            gap: 5px;
        }

        .life-icon {
            font-size: 24px;
        }

        #instructions {
            margin-top: 15px;
            font-size: 16px;
            color: #555;
        }

        .game-over {
            color: #d9534f;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <div id="canvasWrapper">
            <canvas id="gameCanvas" width="800" height="400"></canvas>
            <div id="scoreDisplay">
                <div id="currentScore">Score: 0</div>
                <div id="topScore">Top Score: 0</div>
                <div id="livesDisplay"></div>
            </div>
        </div>
        <div id="instructions">Press SPACE to jump | Avoid birds and jump over mice!</div>
    </div>

    <!-- Audio elements -->
    <audio id="hitSound" preload="auto">
        <source src="https://raw.githubusercontent.com/Aonner/soundeffects/main/a_cute%2C_leaping_soun_%233-1761408818575.mp3" type="audio/mpeg">
    </audio>
    <audio id="jumpSound" preload="auto">
        <source src="https://raw.githubusercontent.com/Aonner/soundeffects/main/a_jumping_sound.-1761409662267.mp3" type="audio/mpeg">
    </audio>
    <audio id="backgroundMusic" preload="auto" loop>
        <source src="https://raw.githubusercontent.com/Aonner/soundeffects/main/Mittens%20v1.0.mp3" type="audio/mpeg">
    </audio>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Audio
        const hitSound = document.getElementById('hitSound');
        hitSound.volume = 0.5; // Set to 50% volume
        const jumpSound = document.getElementById('jumpSound');
        jumpSound.volume = 0.5; // Set to 50% volume
        const backgroundMusic = document.getElementById('backgroundMusic');
        backgroundMusic.volume = 0.5; // Set to 50% volume

        // Game state
        let gameState = 'titleScreen'; // 'titleScreen', 'playing', or 'gameOver'
        let score = 0;
        let topScore = 0;
        let frameCount = 0;
        let lives = 0;
        let maxLives = 3;
        let lastLifeScore = 0; // Track when last life was awarded

        // Mittens the Cat
        const mittens = {
            x: 100,
            y: 280,
            width: 40,
            height: 40,
            velocityY: 0,
            gravity: 0.6,
            jumpPower: -12,
            isJumping: false,
            isHit: false,
            groundY: 280,

            jump() {
                if (!this.isJumping && gameState === 'playing') {
                    this.velocityY = this.jumpPower;
                    this.isJumping = true;

                    // Play jump sound
                    jumpSound.currentTime = 0; // Reset to start
                    jumpSound.play().catch(e => console.log('Jump audio play failed:', e));
                }
            },

            update() {
                this.velocityY += this.gravity;
                this.y += this.velocityY;

                // Ground collision
                if (this.y >= this.groundY) {
                    this.y = this.groundY;
                    this.velocityY = 0;
                    this.isJumping = false;
                }
            },

            draw() {
                if (this.isHit) {
                    // Draw Mittens upside down when hit
                    // Cat body (upside down)
                    ctx.fillStyle = '#FFA500';
                    ctx.fillRect(this.x, this.y, this.width, this.height);

                    // Cat ears (now at bottom since upside down)
                    ctx.fillStyle = '#FF8C00';
                    ctx.beginPath();
                    ctx.moveTo(this.x + 5, this.y + this.height);
                    ctx.lineTo(this.x + 15, this.y + this.height + 10);
                    ctx.lineTo(this.x + 15, this.y + this.height);
                    ctx.fill();

                    ctx.beginPath();
                    ctx.moveTo(this.x + 25, this.y + this.height);
                    ctx.lineTo(this.x + 35, this.y + this.height + 10);
                    ctx.lineTo(this.x + 25, this.y + this.height);
                    ctx.fill();

                    // X eyes
                    ctx.strokeStyle = '#000';
                    ctx.lineWidth = 2;
                    // Left X
                    ctx.beginPath();
                    ctx.moveTo(this.x + 8, this.y + 23);
                    ctx.lineTo(this.x + 15, this.y + 30);
                    ctx.moveTo(this.x + 15, this.y + 23);
                    ctx.lineTo(this.x + 8, this.y + 30);
                    ctx.stroke();

                    // Right X
                    ctx.beginPath();
                    ctx.moveTo(this.x + 23, this.y + 23);
                    ctx.lineTo(this.x + 30, this.y + 30);
                    ctx.moveTo(this.x + 30, this.y + 23);
                    ctx.lineTo(this.x + 23, this.y + 30);
                    ctx.stroke();

                    // Tongue sticking out
                    ctx.fillStyle = '#FF69B4';
                    ctx.beginPath();
                    ctx.ellipse(this.x + 20, this.y + 15, 5, 8, 0, 0, Math.PI * 2);
                    ctx.fill();

                    // Whiskers (upside down)
                    ctx.strokeStyle = '#000';
                    ctx.lineWidth = 1;
                    ctx.beginPath();
                    ctx.moveTo(this.x, this.y + 20);
                    ctx.lineTo(this.x - 10, this.y + 22);
                    ctx.moveTo(this.x, this.y + 15);
                    ctx.lineTo(this.x - 10, this.y + 15);
                    ctx.stroke();

                    // Tail (upside down)
                    ctx.strokeStyle = '#FFA500';
                    ctx.lineWidth = 3;
                    ctx.beginPath();
                    ctx.moveTo(this.x, this.y + 10);
                    ctx.quadraticCurveTo(this.x - 20, this.y + 20, this.x - 15, this.y + 40);
                    ctx.stroke();
                } else {
                    // Normal Mittens
                    // Cat body
                    ctx.fillStyle = '#FFA500';
                    ctx.fillRect(this.x, this.y, this.width, this.height);

                    // Cat ears
                    ctx.fillStyle = '#FF8C00';
                    ctx.beginPath();
                    ctx.moveTo(this.x + 5, this.y);
                    ctx.lineTo(this.x + 15, this.y - 10);
                    ctx.lineTo(this.x + 15, this.y);
                    ctx.fill();

                    ctx.beginPath();
                    ctx.moveTo(this.x + 25, this.y);
                    ctx.lineTo(this.x + 35, this.y - 10);
                    ctx.lineTo(this.x + 25, this.y);
                    ctx.fill();

                    // Cat face
                    ctx.fillStyle = '#000';
                    // Eyes
                    ctx.fillRect(this.x + 10, this.y + 10, 5, 5);
                    ctx.fillRect(this.x + 25, this.y + 10, 5, 5);

                    // Whiskers
                    ctx.strokeStyle = '#000';
                    ctx.lineWidth = 1;
                    ctx.beginPath();
                    ctx.moveTo(this.x, this.y + 20);
                    ctx.lineTo(this.x - 10, this.y + 18);
                    ctx.moveTo(this.x, this.y + 25);
                    ctx.lineTo(this.x - 10, this.y + 25);
                    ctx.stroke();

                    // Tail
                    ctx.strokeStyle = '#FFA500';
                    ctx.lineWidth = 3;
                    ctx.beginPath();
                    ctx.moveTo(this.x, this.y + 30);
                    ctx.quadraticCurveTo(this.x - 20, this.y + 20, this.x - 15, this.y);
                    ctx.stroke();
                }
            }
        };

        // Sun
        const sun = {
            x: 700,
            baseX: 700,
            y: 80,
            radius: 40,
            dancing: true,
            danceOffset: 0,
            danceSpeed: 0.05,
            danceRange: 15,

            update() {
                if (this.dancing && (gameState === 'playing' || gameState === 'titleScreen')) {
                    this.danceOffset += this.danceSpeed;
                    this.x = this.baseX + Math.sin(this.danceOffset) * this.danceRange;
                }
            },

            draw() {
                // Sun circle
                ctx.fillStyle = '#FFD700';
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fill();

                // Sun rays
                ctx.strokeStyle = '#FFD700';
                ctx.lineWidth = 3;
                for (let i = 0; i < 8; i++) {
                    const angle = (Math.PI * 2 * i) / 8;
                    const x1 = this.x + Math.cos(angle) * (this.radius + 5);
                    const y1 = this.y + Math.sin(angle) * (this.radius + 5);
                    const x2 = this.x + Math.cos(angle) * (this.radius + 15);
                    const y2 = this.y + Math.sin(angle) * (this.radius + 15);
                    ctx.beginPath();
                    ctx.moveTo(x1, y1);
                    ctx.lineTo(x2, y2);
                    ctx.stroke();
                }

                // Face
                ctx.fillStyle = '#000';
                if (gameState === 'playing' || gameState === 'titleScreen') {
                    // Happy eyes
                    ctx.beginPath();
                    ctx.arc(this.x - 12, this.y - 5, 4, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.arc(this.x + 12, this.y - 5, 4, 0, Math.PI * 2);
                    ctx.fill();

                    // Smile
                    ctx.strokeStyle = '#000';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y + 5, 15, 0, Math.PI);
                    ctx.stroke();
                } else {
                    // Sad eyes
                    ctx.fillRect(this.x - 15, this.y - 5, 6, 6);
                    ctx.fillRect(this.x + 9, this.y - 5, 6, 6);

                    // Frown
                    ctx.strokeStyle = '#000';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y + 20, 15, Math.PI, Math.PI * 2);
                    ctx.stroke();

                    // Tears
                    ctx.fillStyle = '#87CEEB';
                    // Left tear
                    ctx.beginPath();
                    ctx.arc(this.x - 12, this.y + 5, 3, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.ellipse(this.x - 12, this.y + 12, 2.5, 4, 0, 0, Math.PI * 2);
                    ctx.fill();

                    // Right tear
                    ctx.beginPath();
                    ctx.arc(this.x + 12, this.y + 5, 3, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.ellipse(this.x + 12, this.y + 12, 2.5, 4, 0, 0, Math.PI * 2);
                    ctx.fill();
                }
            }
        };

        // Enemies
        class Mouse {
            constructor(x) {
                this.x = x;
                this.y = 300;
                this.width = 30;
                this.height = 20;
                this.speed = 3;
            }

            update() {
                if (gameState === 'playing') {
                    this.x -= this.speed;
                }
            }

            draw() {
                // Mouse body
                ctx.fillStyle = '#888';
                ctx.fillRect(this.x, this.y, this.width, this.height);

                // Mouse ears
                ctx.fillStyle = '#666';
                ctx.beginPath();
                ctx.arc(this.x + 5, this.y, 5, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(this.x + 15, this.y, 5, 0, Math.PI * 2);
                ctx.fill();

                // Mouse tail
                ctx.strokeStyle = '#888';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(this.x + this.width, this.y + 10);
                ctx.lineTo(this.x + this.width + 15, this.y + 5);
                ctx.stroke();

                // Eyes
                ctx.fillStyle = '#000';
                ctx.fillRect(this.x + 5, this.y + 8, 2, 2);
                ctx.fillRect(this.x + 12, this.y + 8, 2, 2);
            }

            isOffScreen() {
                return this.x + this.width < 0;
            }
        }

        class Bird {
            constructor(x) {
                this.x = x;
                this.y = 150 + Math.random() * 100;
                this.width = 35;
                this.height = 25;
                this.speed = 4;
                this.flapOffset = Math.random() * Math.PI * 2;
            }

            update() {
                if (gameState === 'playing') {
                    this.x -= this.speed;
                    this.flapOffset += 0.2;
                }
            }

            draw() {
                const wingFlap = Math.sin(this.flapOffset) * 10;

                // Bird body
                ctx.fillStyle = '#4169E1';
                ctx.beginPath();
                ctx.ellipse(this.x + 17, this.y + 12, 17, 12, 0, 0, Math.PI * 2);
                ctx.fill();

                // Wings
                ctx.fillStyle = '#1E90FF';
                ctx.beginPath();
                ctx.ellipse(this.x + 10, this.y + 10 + wingFlap, 15, 8, -0.3, 0, Math.PI * 2);
                ctx.fill();

                ctx.beginPath();
                ctx.ellipse(this.x + 24, this.y + 10 - wingFlap, 15, 8, 0.3, 0, Math.PI * 2);
                ctx.fill();

                // Beak
                ctx.fillStyle = '#FFA500';
                ctx.beginPath();
                ctx.moveTo(this.x, this.y + 12);
                ctx.lineTo(this.x - 8, this.y + 15);
                ctx.lineTo(this.x, this.y + 18);
                ctx.fill();

                // Eye
                ctx.fillStyle = '#000';
                ctx.beginPath();
                ctx.arc(this.x + 5, this.y + 10, 2, 0, Math.PI * 2);
                ctx.fill();
            }

            isOffScreen() {
                return this.x + this.width < 0;
            }
        }

        // Arrays to hold enemies
        let mice = [];
        let birds = [];

        // Spawn enemies
        function spawnEnemies() {
            if (gameState !== 'playing') return;

            // Spawn mice
            if (frameCount % 120 === 0) {
                mice.push(new Mouse(canvas.width));
            }

            // Spawn birds
            if (frameCount % 180 === 30) {
                birds.push(new Bird(canvas.width));
            }
        }

        // Handle collision - check lives before game over
        function handleHit() {
            if (lives > 0) {
                // Use an extra life
                lives--;
                // Play hit sound
                hitSound.currentTime = 0;
                hitSound.play().catch(e => console.log('Audio play failed:', e));
                // Brief repositioning to show hit occurred
                mittens.y = mittens.groundY;
                mittens.velocityY = 0;
            } else {
                // No lives left, game over
                gameOver();
            }
        }

        // Collision detection
        function checkCollisions() {
            // Check collision with mice
            for (let mouse of mice) {
                if (mittens.x < mouse.x + mouse.width &&
                    mittens.x + mittens.width > mouse.x &&
                    mittens.y + mittens.height > mouse.y &&
                    mittens.y < mouse.y + mouse.height) {
                    handleHit();
                    mice = mice.filter(m => m !== mouse); // Remove the mouse
                    return; // Exit to prevent multiple collisions in one frame
                }
            }

            // Check collision with birds
            for (let bird of birds) {
                if (mittens.x < bird.x + bird.width &&
                    mittens.x + mittens.width > bird.x &&
                    mittens.y < bird.y + bird.height &&
                    mittens.y + mittens.height > bird.y) {
                    handleHit();
                    birds = birds.filter(b => b !== bird); // Remove the bird
                    return; // Exit to prevent multiple collisions in one frame
                }
            }
        }

        // Game over
        function gameOver() {
            gameState = 'gameOver';
            mittens.isHit = true;
            sun.dancing = false;

            // Play hit sound
            hitSound.currentTime = 0; // Reset to start
            hitSound.play().catch(e => console.log('Audio play failed:', e));

            // Stop background music
            backgroundMusic.pause();

            // Update top score if current score is higher
            if (score > topScore) {
                topScore = score;
            }

            document.getElementById('instructions').innerHTML =
                '<span class="game-over">GAME OVER!</span> Press R to restart';
        }

        // Restart game
        function restartGame() {
            gameState = 'playing';
            score = 0;
            frameCount = 0;
            lives = 0;
            lastLifeScore = 0;
            mice = [];
            birds = [];
            mittens.y = mittens.groundY;
            mittens.velocityY = 0;
            mittens.isJumping = false;
            mittens.isHit = false;
            sun.dancing = true;
            sun.danceOffset = 0;
            document.getElementById('scoreDisplay').style.display = 'block';
            document.getElementById('instructions').style.display = 'block';
            document.getElementById('instructions').innerHTML =
                'Press SPACE to jump | Avoid birds and jump over mice!';

            // Restart background music
            backgroundMusic.currentTime = 0; // Reset to start
            backgroundMusic.play().catch(e => console.log('Background music play failed:', e));
        }

        // Start game from title screen
        function startGame() {
            gameState = 'playing';
            score = 0;
            frameCount = 0;
            lives = 0;
            lastLifeScore = 0;
            mice = [];
            birds = [];
            mittens.y = mittens.groundY;
            mittens.velocityY = 0;
            mittens.isJumping = false;
            mittens.isHit = false;
            sun.dancing = true;
            sun.danceOffset = 0;
            document.getElementById('scoreDisplay').style.display = 'block';
            document.getElementById('instructions').style.display = 'block';
            document.getElementById('instructions').innerHTML =
                'Press SPACE to jump | Avoid birds and jump over mice!';

            // Start background music
            backgroundMusic.currentTime = 0; // Reset to start
            backgroundMusic.play().catch(e => console.log('Background music play failed:', e));
        }

        // Update game
        function update() {
            if (gameState === 'titleScreen') {
                sun.update();
            } else if (gameState === 'playing') {
                frameCount++;
                score = Math.floor(frameCount / 10);

                // Award extra life every 100 points (max 3 lives)
                if (score > 0 && score % 100 === 0 && score > lastLifeScore && lives < maxLives) {
                    lives++;
                    lastLifeScore = score;
                }

                mittens.update();
                sun.update();

                // Update and remove off-screen mice
                mice = mice.filter(mouse => {
                    mouse.update();
                    return !mouse.isOffScreen();
                });

                // Update and remove off-screen birds
                birds = birds.filter(bird => {
                    bird.update();
                    return !bird.isOffScreen();
                });

                spawnEnemies();
                checkCollisions();
            }
        }

        // Update lives display with cat icons
        function updateLivesDisplay() {
            const livesDisplay = document.getElementById('livesDisplay');
            livesDisplay.innerHTML = '';
            for (let i = 0; i < lives; i++) {
                const lifeIcon = document.createElement('span');
                lifeIcon.className = 'life-icon';
                lifeIcon.textContent = '🐱';
                livesDisplay.appendChild(lifeIcon);
            }
        }

        // Draw title screen
        function drawTitleScreen() {
            // Draw sun
            sun.draw();

            // Draw title
            ctx.fillStyle = '#FF6B35';
            ctx.strokeStyle = '#333';
            ctx.lineWidth = 4;
            ctx.font = 'bold 60px Arial';
            ctx.textAlign = 'center';
            ctx.strokeText("Mittens' Grand Adventure", canvas.width / 2, 180);
            ctx.fillText("Mittens' Grand Adventure", canvas.width / 2, 180);

            // Draw subtitle
            ctx.fillStyle = '#333';
            ctx.font = '24px Arial';
            ctx.fillText('Press Space Bar to Start', canvas.width / 2, 240);
        }

        // Draw game
        function draw() {
            // Clear canvas
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (gameState === 'titleScreen') {
                drawTitleScreen();
            } else {
                // Draw ground line
                ctx.strokeStyle = '#228B22';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(0, 320);
                ctx.lineTo(canvas.width, 320);
                ctx.stroke();

                // Draw sun
                sun.draw();

                // Draw enemies
                mice.forEach(mouse => mouse.draw());
                birds.forEach(bird => bird.draw());

                // Draw Mittens
                mittens.draw();

                // Update score display
                document.getElementById('currentScore').textContent = `Score: ${score}`;
                document.getElementById('topScore').textContent = `Top Score: ${topScore}`;

                // Update lives display
                updateLivesDisplay();
            }
        }

        // Game loop
        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        // Keyboard controls
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault();
                if (gameState === 'titleScreen') {
                    startGame();
                } else if (gameState === 'playing') {
                    mittens.jump();
                }
            }
            if (e.code === 'KeyR' && gameState === 'gameOver') {
                restartGame();
            }
        });

        // Initialize
        document.getElementById('scoreDisplay').style.display = 'none';
        document.getElementById('instructions').style.display = 'none';

        // Start game
        gameLoop();
    </script>
</body>
</html>
